name: Workshop website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout public source at the workflow commit
        run: |
          git init -q
          git fetch --depth=1 https://github.com/hoanganhdo2316-png/fcj-workshop-template.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.3"
          extended: true
      - name: Build and check both languages
        env:
          HUGO_CANONIFYURLS: "true"
        run: |
          site="$RUNNER_TEMP/workshop-site"
          hugo --minify --baseURL https://macket.io.vn/workshop/ --destination "$site"
          test -s "$site/index.html"
          test -s "$site/vi/index.html"
          test -s "$site/5-workshop/index.html"
          test -s "$site/vi/5-workshop/index.html"
          test -s "$site/index.json"
          test -s "$site/vi/index.json"
          if grep -rE " (src|href)=[\"']?/images/" --include='*.html' "$site"; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > "$site/revision.txt"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/workshop-site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
