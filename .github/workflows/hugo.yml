name: Workshop website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.3"
          extended: true
      - name: Build and check both languages
        env:
          HUGO_CANONIFYURLS: "true"
        run: |
          hugo --minify --baseURL https://macket.io.vn/workshop/
          test -s public/index.html
          test -s public/vi/index.html
          test -s public/5-workshop/index.html
          test -s public/vi/5-workshop/index.html
          test -s public/index.json
          test -s public/vi/index.json
          if grep -rE ' (src|href)=["\x27]?/images/' --include='*.html' public; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > public/revision.txt
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
